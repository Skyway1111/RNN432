<script type="module">

import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

const D = window.DATA;
const N = 16, T = 10;
const base = D.weights;
const W = { Wi: base.Wi.slice(), Wh: base.Wh.map(r => r.slice()), Wo: base.Wo.map(r => r.slice()) };

// ---------- the model, exactly as in az/model.py ----------
function run(W, x) {

// ---------- the cascade behind an answer (research/findings/circuit.md, "The cascade near a tie") ----------

const roundColor = k => ROUND_COLORS[Math.min(k, 5)];

    for (let n = 0; n < N; n++) {
      const row = W.Wh[n]; let s = x[t] * W.Wi[n];
      for (let j = 0; j < N; j++) s += row[j] * hp[j];

}
const sameGates = (a, b) => a.every((row, t) => row.every((g, n) => g === b[t][n]));
function cascade(W, x) {

  return { q, xr, ref, refMargin: marginOf(ref.logits), rounds, margins: rounds.map(r => marginOf(r.logits)), settle, converged: sameGates(last.gates, truth.gates), truth: marginOf(truth.logits), answer: argmax(truth.logits), push, threshold };
}
let cascadeKey = null, cascadeVal = null;
function cascadeNow() { const key = state.wver + ':' + state.x.join(','); if (key !== cascadeKey) { cascadeKey = key; cascadeVal = cascade(W, state.x); } return cascadeVal; }

// the 270 reference inputs of the what-if: one per (p, q) at the mean magnitude set and two near-tie variants
const REF = (() => {
  const y = D.meanSet, sets = [y.slice(), y.slice(), y.slice()];
  sets[1][2] = sets[1][1] - 0.05; sets[2][1] = sets[2][0] - 0.05;
  const out = [];

    const v = new Array(10).fill(0); v[a] = ys[0]; v[b] = ys[1];
    let k = 2; for (let t = 0; t < 10; t++) if (t !== a && t !== b) v[t] = ys[k++];
    out.push({ x: v, q: b });
  }
  return out;
})();
const refWrong = W => REF.reduce((s, r) => s + (run(W, r.x).pred !== r.q ? 1 : 0), 0);
const REF_BASE = refWrong(base);

// ---------- scene ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
document.getElementById('labels').appendChild(labelRenderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(PAL.page, 18, 36);
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
camera.position.set(0, 3.5, 15);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.autoRotate = !reduced; controls.autoRotateSpeed = 0.35;
controls.target.set(0, 0, 0);
// ink specks: a faint field the machine floats in
{
  const g = new THREE.BufferGeometry(), pts = [];
  for (let i = 0; i < 900; i++) { const r = 9 + Math.random() * 18, th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1); pts.push(r * Math.sin(ph) * Math.cos(th), r * Math.sin(ph) * Math.sin(th) * 0.6, r * Math.cos(ph)); }
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: PAL.ink, size: 0.035, transparent: true, opacity: 0.22 })));
}

// layout: inputs on the left column, outputs on the right, core ring inside the place-cell ring
const CORE = [2, 4, 7, 6, 1, 8];
const SAT = [...Array(N).keys()].filter(n => !CORE.includes(n));
const pos = { input: [], neuron: new Array(N), output: [] };
for (let t = 0; t < 10; t++) { pos.input.push(new THREE.Vector3(-7.2, 4.0 - t * 0.9, 0)); pos.output.push(new THREE.Vector3(7.2, 4.0 - t * 0.9, 0)); }
CORE.forEach((n, i) => { const a = i / 6 * Math.PI * 2 + 0.4; pos.neuron[n] = new THREE.Vector3(Math.cos(a) * 1.8, (i % 2 ? 0.9 : -0.9), Math.sin(a) * 1.8); });
SAT.forEach((n, i) => { const a = i / 10 * Math.PI * 2 + 0.25; pos.neuron[n] = new THREE.Vector3(Math.cos(a) * 3.8, (i % 2 ? 1.7 : -1.7), Math.sin(a) * 3.8); });

const nodes = [];  // {kind, index, mesh, label, el}
const sphere = new THREE.SphereGeometry(1, 32, 24), outline = new THREE.MeshBasicMaterial({ color: PAL.ink, side: THREE.BackSide, depthTest: false, transparent: true });
const PALE = new THREE.Color(PAL.page);
function addNode(kind, index, p, radius, color) {
  // drawn after the links and over them, as a drawing's specimens sit over its ink
  const mat = new THREE.MeshBasicMaterial({ color, depthTest: false, transparent: true });
  const mesh = new THREE.Mesh(sphere, mat);
  mesh.position.copy(p); mesh.scale.setScalar(radius); mesh.userData = { kind, index }; mesh.renderOrder = 3;
  const shell = new THREE.Mesh(sphere, outline); shell.scale.setScalar(1.1); shell.raycast = () => {}; shell.renderOrder = 2; mesh.add(shell);
  scene.add(mesh);
  // the renderer moves a zero-size anchor; the label hangs from it below a neuron's rim, beside an input or output
  const anchor = document.createElement('div'), el = document.createElement('div');
  anchor.className = 'anchor ' + kind; el.className = 'label' + (kind === 'neuron' ? '' : ' io'); anchor.appendChild(el);
  const label = new CSS2DObject(anchor); label.position.set(0, kind === 'neuron' ? -1.12 : 0, 0); mesh.add(label);
  nodes.push({ kind, index, mesh, el, mat });

}
for (let t = 0; t < 10; t++) addNode('input', t, pos.input[t], 0.17, PAL['surface-2']);
for (let n = 0; n < N; n++) addNode('neuron', n, pos.neuron[n], CORE.includes(n) ? 0.34 : 0.27, CORE.includes(n) ? PAL.core : PAL.timer);
for (let i = 0; i < 10; i++) addNode('output', i, pos.output[i], 0.17, PAL['surface-2']);
const nodeOf = (kind, i) => nodes.find(n => n.kind === kind && n.index === i);

// links: recurrent (always), from the current input (16), to the outputs (160, faint)
const POS = new THREE.Color(PAL.pos), NEG = new THREE.Color(PAL.neg), DIM = new THREE.Color(PAL.page);  // faint links fade into the paper
const res = new THREE.Vector2(innerWidth, innerHeight);
function makeLines(segs, width) {

  geo.setColors(new Array(segs.length * 6).fill(0.2));
  const mat = new LineMaterial({ linewidth: width, vertexColors: true, transparent: true, opacity: 0.95, resolution: res, worldUnits: false });
  const obj = new LineSegments2(geo, mat); obj.computeLineDistances(); obj.userData.segs = segs; scene.add(obj);

}
const rec = [];  // {i, j, w, a, b}
const absW = base.Wh.flat().map(Math.abs).sort((a, b) => a - b);
const wmax = absW[absW.length - 1], wcut = absW[Math.floor(absW.length * 0.6)];
for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) if (i !== j && Math.abs(base.Wh[i][j]) >= wcut) rec.push({ kind: 'Wh', i, j, a: pos.neuron[j], b: pos.neuron[i] });

const recThick = makeLines(rec.filter(s => Math.abs(base.Wh[s.i][s.j]) >= wmax * 0.12), 2.6);
const outSegs = []; for (let i = 0; i < 10; i++) for (let n = 0; n < N; n++) outSegs.push({ kind: 'Wo', i, j: n, a: pos.neuron[n], b: pos.output[i] });
const outLines = makeLines(outSegs, 1.0);
const inSegs = []; for (let n = 0; n < N; n++) inSegs.push({ kind: 'Wi', i: n, j: 0, a: pos.input[0].clone(), b: pos.neuron[n] });
const inLines = makeLines(inSegs, 1.4);

function weightOf(s) { return s.kind === 'Wh' ? W.Wh[s.i][s.j] : s.kind === 'Wo' ? W.Wo[s.i][s.j] : W.Wi[s.i]; }

    const el = document.getElementById('logit' + i);

    el.innerHTML = s === T ? `<span></span><span>${i === q ? '<span class="truth" title="the runner-up\'s position">▲ </span>' : ''}${fmt(tr.logits[i], 0)}</span>` : '';
  }

}

// ---------- panel ----------
const panel = document.getElementById('panel');
function bars(values, { signed = true, labels = null, max = null, height = 56, title = '' } = {}) {
  const w = 320, n = values.length, bw = w / n, m = max ?? Math.max(1e-9, ...values.map(Math.abs));
  const mid = signed ? height / 2 : height;

  s += `<line x1="0" x2="${w}" y1="${mid}" y2="${mid}" stroke="${PAL.axis}" />`;
  values.forEach((v, i) => {
    const hgt = Math.abs(v) / m * (signed ? height / 2 : height);
    const y = v >= 0 ? mid - hgt : mid;
    s += `<rect x="${i * bw + 2}" y="${y}" width="${bw - 4}" height="${Math.max(0.5, hgt)}" rx="2" fill="${v >= 0 ? PAL.pos : PAL.neg}"><title>${labels ? labels[i] : i}: ${v.toFixed(2)}</title></rect>`;

// ---------- picking ----------
const ray = new THREE.Raycaster();

const mouse = new THREE.Vector2();

  if (hit) { select({ kind: hit.object.userData.kind, index: hit.object.userData.index }); return; }

// the view ends above the input strip, so no node sits behind it; a phone's view is the top of a scrolling page
function viewport() {

}
function resize() {
